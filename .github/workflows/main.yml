name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # optional: run tests/scripts with secrets
      # env:
      #   MONGODB_URI: ${{ secrets.MONGODB_URI }}
      #   ROOT_ADMIN_EMAIL: ${{ secrets.ROOT_ADMIN_EMAIL }}
      #   ROOT_ADMIN_PASSWORD: ${{ secrets.ROOT_ADMIN_PASSWORD }}
